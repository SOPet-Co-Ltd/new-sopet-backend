# SOPET Backend CI
# Lite (format + lint): PRs whose base is NOT deploy/production or deploy/uat
# Full (format + build + unit + e2e): PRs targeting deploy/production or deploy/uat
# Security (yarn audit): all PRs; advisory (continue-on-error) while known highs remain

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Yarn classic: --level high fails when high/critical exist (exit bitmask).
      # Known highs blocking a hard gate (2026-10-03): axios (direct), braces via
      # @nestjs/graphql → fast-glob → micromatch. Keep advisory until the tree clears.
      - name: Dependency audit (high+)
        continue-on-error: true
        run: yarn audit --level high --groups dependencies

  lite:
    if: github.base_ref != 'deploy/production' && github.base_ref != 'deploy/uat'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format check
        run: yarn format:check

      - name: Lint
        # package.json `lint` uses --fix; CI must not rewrite the tree.
        # Type-aware unsafe-* rules are warn-only (pre-existing debt); fail on errors only.
        run: yarn eslint "{src,apps,libs,test}/**/*.ts"

  full:
    if: github.base_ref == 'deploy/production' || github.base_ref == 'deploy/uat'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sopet_ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sopet_ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production
      BEAM_API_BASE_URL: https://playground.api.beamcheckout.com
      BEAM_MERCHANT_ID: ci_dummy_merchant
      BEAM_API_KEY: ci_dummy_api_key
      BEAM_PUBLISHABLE_KEY: ci_dummy_publishable_key
      BEAM_WEBHOOK_SECRET: Y2lfZHVtbXk=
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: sopet_ecommerce
      DB_SSL: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format check
        run: yarn format:check

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test

      - name: Run migrations
        run: yarn migration:run

      - name: E2E tests
        run: yarn test:e2e
