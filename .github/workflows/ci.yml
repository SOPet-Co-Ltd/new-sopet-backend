# SOPET Backend CI
# Lite (format + lint): PRs whose base is NOT deploy/production or deploy/uat
# Full (format + build + unit + e2e): PRs targeting deploy/production or deploy/uat
# Security (yarn audit): all PRs; audit is advisory until Dependabot clears known highs
# E2E tests use mocked repositories/services — no PostgreSQL, Redis, or MinIO required.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Yarn classic: --level high fails when high/critical exist (exit bitmask).
      # Transitive highs (e.g. typeorm → brace-expansion) currently block a hard gate;
      # keep advisory (continue-on-error) and rely on Dependabot to drive remediation.
      - name: Dependency audit (high+)
        continue-on-error: true
        run: yarn audit --level high --groups dependencies

  lite:
    if: github.base_ref != 'deploy/production' && github.base_ref != 'deploy/uat'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format check
        run: yarn format:check

      - name: Lint
        # package.json `lint` uses --fix; CI must not rewrite the tree.
        # Type-aware unsafe-* rules are warn-only (pre-existing debt); fail on errors only.
        run: yarn eslint "{src,apps,libs,test}/**/*.ts"

  full:
    if: github.base_ref == 'deploy/production' || github.base_ref == 'deploy/uat'
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production
      OMISE_SECRET_KEY: skey_test_ci_dummy
      OMISE_PUBLIC_KEY: pkey_test_ci_dummy
      OMISE_WEBHOOK_SECRET: whsec_ci_dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format check
        run: yarn format:check

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        run: yarn test:e2e
