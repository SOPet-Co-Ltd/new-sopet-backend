# SOPET Backend CI
# Lite (format + lint): PRs whose base is NOT deploy/production or deploy/uat
# Full (format + build + unit + e2e): PRs targeting deploy/production or deploy/uat
# E2E tests use mocked repositories/services — no PostgreSQL, Redis, or MinIO required.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# INF2-002 — least-privilege workflow token (read-only checkout/audit)
permissions:
  contents: read

jobs:
  lite:
    if: github.base_ref != 'deploy/production' && github.base_ref != 'deploy/uat'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit critical dependencies
        # Yarn classic exits with a severity bitmask; only fail on Critical (16).
        run: |
          set +e
          yarn audit --level critical
          code=$?
          set -e
          if (( code & 16 )); then exit 1; fi
          exit 0

      - name: Format check
        run: yarn format:check

      - name: Lint
        # package.json `lint` uses --fix; CI must not rewrite the tree.
        # Type-aware unsafe-* rules are warn-only (pre-existing debt); fail on errors only.
        run: yarn eslint "{src,apps,libs,test}/**/*.ts"

  full:
    if: github.base_ref == 'deploy/production' || github.base_ref == 'deploy/uat'
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production
      OMISE_SECRET_KEY: skey_test_ci_dummy
      OMISE_PUBLIC_KEY: pkey_test_ci_dummy
      OMISE_WEBHOOK_SECRET: whsec_ci_dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit critical dependencies
        # Yarn classic exits with a severity bitmask; only fail on Critical (16).
        run: |
          set +e
          yarn audit --level critical
          code=$?
          set -e
          if (( code & 16 )); then exit 1; fi
          exit 0

      - name: Format check
        run: yarn format:check

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        run: yarn test:e2e
