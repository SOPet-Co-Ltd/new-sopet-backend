# SOPET Backend — Build to ECR, deploy on EC2 via SSM
# Triggers on push to deploy/production or deploy/uat.
#
# GitHub Environment vars/secrets are mapped once in "Load GitHub Environment"
# (step-level env → GITHUB_ENV). Keys: infra/github-env.keys
#
# Runner selection: Environment-scoped vars are reliable inside a job with
# `environment:`, but NOT when evaluating that same job's `runs-on` (chicken-and-egg
# at schedule time). A tiny resolve-runner job reads Environment DOCKER_PLATFORM and
# outputs the runner label; deploy uses needs.*.outputs.runner.

name: Deploy

on:
  push:
    branches: [deploy/production, deploy/uat]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # Read Environment DOCKER_PLATFORM on a fixed runner, then hand the label to deploy.
  resolve-runner:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'deploy/production' && 'deploy/production' || 'deploy/uat' }}
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      platform: ${{ steps.resolve.outputs.platform }}
    steps:
      - name: Resolve runner from Environment DOCKER_PLATFORM
        id: resolve
        env:
          DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM }}
        run: |
          PLATFORM="${DOCKER_PLATFORM:-linux/amd64}"
          case "$PLATFORM" in
            linux/arm64)
              RUNNER="ubuntu-24.04-arm"
              ;;
            linux/amd64)
              RUNNER="ubuntu-latest"
              ;;
            *)
              echo "::error::Unsupported DOCKER_PLATFORM='$PLATFORM' (use linux/arm64 or linux/amd64)"
              exit 1
              ;;
          esac
          {
            echo "platform=$PLATFORM"
            echo "runner=$RUNNER"
          } >> "$GITHUB_OUTPUT"
          echo "DOCKER_PLATFORM=$PLATFORM → runs-on=$RUNNER"

  deploy:
    needs: resolve-runner
    # Native arm64 on ubuntu-24.04-arm (avoids QEMU); amd64 on ubuntu-latest.
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    environment: ${{ github.ref_name == 'deploy/production' && 'deploy/production' || 'deploy/uat' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load GitHub Environment
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM }}
          CADDY_HOSTNAME: ${{ vars.CADDY_HOSTNAME }}
          CADDY_ADMIN_EMAIL: ${{ vars.CADDY_ADMIN_EMAIL }}
          CADDY_TLS_CERT: ${{ vars.CADDY_TLS_CERT }}
          CADDY_TLS_KEY: ${{ vars.CADDY_TLS_KEY }}
          CADDY_TLS_ENABLED: ${{ vars.CADDY_TLS_ENABLED }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_SSL: ${{ vars.DB_SSL }}
          DB_POOL_MAX: ${{ vars.DB_POOL_MAX }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_DB: ${{ vars.REDIS_DB }}
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER }}
          CDN_URL: ${{ vars.CDN_URL }}
          JWT_ACCESS_EXPIRES_IN: ${{ vars.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ vars.JWT_REFRESH_EXPIRES_IN }}
          THAIBULKSMS_SENDER: ${{ vars.THAIBULKSMS_SENDER }}
          THAIBULKSMS_FORCE: ${{ vars.THAIBULKSMS_FORCE }}
          THAIBULKSMS_SHORTEN_URL: ${{ vars.THAIBULKSMS_SHORTEN_URL }}
          PAYMENT_QR_EXPIRY_MINUTES: ${{ vars.PAYMENT_QR_EXPIRY_MINUTES }}
          PAYMENT_EXPIRY_CHECK_INTERVAL_MS: ${{ vars.PAYMENT_EXPIRY_CHECK_INTERVAL_MS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          API_URL: ${{ vars.API_URL }}
          STOREFRONT_URL: ${{ vars.STOREFRONT_URL }}
          ADMIN_PANEL_URL: ${{ vars.ADMIN_PANEL_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          RATE_LIMIT_TTL: ${{ vars.RATE_LIMIT_TTL }}
          RATE_LIMIT_MAX: ${{ vars.RATE_LIMIT_MAX }}
          SEARCH_SMART_ENABLED: ${{ vars.SEARCH_SMART_ENABLED }}
          REVIEW_AUTO_APPROVE: ${{ vars.REVIEW_AUTO_APPROVE }}
          REVIEW_WINDOW_DAYS: ${{ vars.REVIEW_WINDOW_DAYS }}
          PAYOUT_CRON_SCHEDULE: ${{ vars.PAYOUT_CRON_SCHEDULE }}
          PAYOUT_CRON_TIMEZONE: ${{ vars.PAYOUT_CRON_TIMEZONE }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          THAIBULKSMS_API_KEY: ${{ secrets.THAIBULKSMS_API_KEY }}
          THAIBULKSMS_API_SECRET: ${{ secrets.THAIBULKSMS_API_SECRET }}
          OMISE_PUBLIC_KEY: ${{ secrets.OMISE_PUBLIC_KEY }}
          OMISE_SECRET_KEY: ${{ secrets.OMISE_SECRET_KEY }}
          OMISE_WEBHOOK_SECRET: ${{ secrets.OMISE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          chmod +x infra/export-github-env.sh
          infra/export-github-env.sh

      - name: Validate GitHub Environment configuration
        run: |
          chmod +x infra/validate-deploy-env.sh
          infra/validate-deploy-env.sh '${{ github.ref_name == 'deploy/production' && 'production' || 'uat' }}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Run database migrations
        run: |
          yarn install --frozen-lockfile --production=false
          yarn typeorm migration:show -d ormconfig.ts
          yarn migration:run

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image exists in ECR
        id: check-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing image $ECR_REPOSITORY:$IMAGE_TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image not found — will build and push $ECR_REPOSITORY:$IMAGE_TAG"
          fi

      # Plain docker build/push (not buildx --push): Buildx's container driver often
      # fails to receive host docker login, and ECR reports that as an expired token.
      # Runner matches platform (ubuntu-latest = amd64, ubuntu-24.04-arm = arm64),
      # so no QEMU. Optional escape hatch: vars.BUILD_ON_HOST=true builds on EC2 instead.
      - name: Build, tag, and push image to Amazon ECR
        if: vars.BUILD_ON_HOST != 'true' && steps.check-image.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM }}
          RESOLVED_PLATFORM: ${{ needs.resolve-runner.outputs.platform }}
        run: |
          PLATFORM="${DOCKER_PLATFORM:-linux/amd64}"
          HOST_ARCH="$(uname -m)"
          echo "Building image on GHA ($HOST_ARCH) for platform: $PLATFORM"

          if [ -n "$RESOLVED_PLATFORM" ] && [ "$PLATFORM" != "$RESOLVED_PLATFORM" ]; then
            echo "::error::DOCKER_PLATFORM mismatch: Environment='$PLATFORM' vs resolve-runner='$RESOLVED_PLATFORM'"
            exit 1
          fi

          case "$PLATFORM" in
            linux/arm64)
              if [ "$HOST_ARCH" != "aarch64" ] && [ "$HOST_ARCH" != "arm64" ]; then
                echo "::error::DOCKER_PLATFORM=linux/arm64 requires a native ARM runner (uname -m=$HOST_ARCH)."
                echo "::error::Expected runs-on=ubuntu-24.04-arm. Refusing QEMU/cross-build (exec format error)."
                exit 1
              fi
              ;;
            linux/amd64)
              if [ "$HOST_ARCH" != "x86_64" ] && [ "$HOST_ARCH" != "amd64" ]; then
                echo "::error::DOCKER_PLATFORM=linux/amd64 requires an amd64 runner (uname -m=$HOST_ARCH)."
                echo "::error::Expected runs-on=ubuntu-latest."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported DOCKER_PLATFORM='$PLATFORM' (use linux/arm64 or linux/amd64)"
              exit 1
              ;;
          esac

          # Fresh login immediately before push (avoids stale/Buildx auth failures)
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker build \
            --platform "$PLATFORM" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Note build on EC2 (escape hatch)
        if: vars.BUILD_ON_HOST == 'true' && steps.check-image.outputs.exists != 'true'
        run: |
          echo "BUILD_ON_HOST=true: image will be built on EC2 via infra/ec2/build-on-host.sh"

      - name: Render runtime env file
        run: bash infra/render-env-file.sh .env.deploy

      - name: Render Caddyfile
        run: |
          chmod +x infra/render-caddyfile.sh
          infra/render-caddyfile.sh .caddy.deploy
          echo "--- Rendered Caddyfile ---"
          cat .caddy.deploy

      # Default: EC2 only pulls + restarts (SSM ~1800s). Optional BUILD_ON_HOST=true
      # enables native docker build on EC2 (3600s poll/execution in deploy-via-ssm.sh).
      # Optional: set GitHub var SSM_CLOUDWATCH_LOG_GROUP (e.g. /sopet/ssm/deploy)
      # after creating the log group + updating EC2 IAM.
      - name: Deploy to EC2 via SSM
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          BUILD_ON_HOST: ${{ vars.BUILD_ON_HOST == 'true' && steps.check-image.outputs.exists != 'true' }}
          GIT_COMMIT: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSM_CLOUDWATCH_LOG_GROUP: ${{ vars.SSM_CLOUDWATCH_LOG_GROUP }}
        run: |
          chmod +x infra/deploy-via-ssm.sh infra/ec2/*.sh
          infra/deploy-via-ssm.sh .env.deploy .caddy.deploy
